<!DOCTYPE html>
<html>
<head>
    <title>Моя библиотека</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>📚 Моя библиотека</h1>

    <a href="/add">➕ Добавить книгу</a>

    <br><br>

    {% if books %}

        <table border="1" cellpadding="10">

            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Автор</th>
                <th>Год</th>
                <th>Действия</th>
            </tr>

            {% for book in books %}

                <tr>
                    <td>{{ book["id"] }}</td>
                    <td>{{ book["title"] }}</td>
                    <td>{{ book["author"] }}</td>
                    <td>{{ book["year"] }}</td>

                    <td>
                        <a href="/edit/{{ book['id'] }}">✏️ Изменить</a>
                        |
                        <a href="/delete/{{ book['id'] }}">🗑️ Удалить</a>
                    </td>
                </tr>

            {% endfor %}

        </table>

    {% else %}

        <p>В библиотеке пока нет книг.</p>

    {% endif %}

</body>
</html>
