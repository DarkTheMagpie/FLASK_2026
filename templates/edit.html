<!DOCTYPE html>
<html>
<head>
    <title>Редактировать книгу</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Редактировать книгу</h1>

    <form method="POST">

        <label>Название:</label>
        <input
            type="text"
            name="title"
            value="{{ book['title'] }}"
            required
        >

        <br><br>

        <label>Автор:</label>
        <input
            type="text"
            name="author"
            value="{{ book['author'] }}"
            required
        >

        <br><br>

        <label>Год:</label>
        <input
            type="number"
            name="year"
            value="{{ book['year'] }}"
            required
        >

        <br><br>

        <button type="submit">Сохранить изменения</button>

    </form>

    <br>

    <a href="/">Вернуться к списку</a>

</body>
</html>
